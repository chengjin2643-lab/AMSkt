<svg xmlns="http://www.w3.org/2000/svg" width="840" height="132" viewBox="0 0 840 132" role="img" aria-labelledby="title desc">
  <title id="title">How AMSkt counts across sites</title>
  <desc id="desc">Each site builds a sketch using the same layout. A trusted service merges matching bitmap words with OR, perturbs the merged readings once, and releases one estimate per group.</desc>
  <rect width="840" height="132" rx="14" fill="#122438"/>
  <g stroke="#718b9c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M261 66h19m-6-5 6 5-6 5M540 66h19m-6-5 6 5-6 5"/>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif">
    <g transform="translate(20 15)">
      <rect width="236" height="102" rx="9" fill="#20374c"/>
      <g fill="#9dceee" font-size="12" font-weight="700" letter-spacing="1.4"><text x="16" y="23">01  /  AT EACH SITE</text></g>
      <text x="16" y="54" fill="#fff" font-size="22" font-weight="600">Sketch locally</text>
      <text x="16" y="80" fill="#d7e4ef" font-size="15">Same layout at every site</text>
    </g>
    <g transform="translate(287 15)">
      <rect width="248" height="102" rx="9" fill="#214044"/>
      <g fill="#98dac5" font-size="12" font-weight="700" letter-spacing="1.4"><text x="16" y="23">02  /  TRUSTED SERVICE</text></g>
      <text x="16" y="54" fill="#fff" font-size="22" font-weight="600">Merge bitmaps</text>
      <text x="16" y="80" fill="#d9eae4" font-size="15">Bitwise OR at matching positions</text>
    </g>
    <g transform="translate(566 15)">
      <rect width="254" height="102" rx="9" fill="#343650"/>
      <g fill="#ccc1f0" font-size="12" font-weight="700" letter-spacing="1.4"><text x="16" y="23">03  /  PRIVATE RELEASE</text></g>
      <text x="16" y="54" fill="#fff" font-size="22" font-weight="600">Release counts</text>
      <text x="16" y="80" fill="#e3e1f1" font-size="15">Noise once per merged reading</text>
    </g>
  </g>
</svg>
